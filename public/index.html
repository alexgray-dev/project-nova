<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Nova</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Project Nova</h1>
      <p>Node.js Express user management API.</p>
      <h2>API Endpoints</h2>
      <ul>
        <li><code>GET /api/users</code> &mdash; list all users</li>
        <li><code>POST /api/users</code> &mdash; create a user</li>
        <li><code>GET /api/users/:id</code> &mdash; get a user by id</li>
        <li><code>PUT /api/users/:id</code> &mdash; update a user</li>
        <li><code>DELETE /api/users/:id</code> &mdash; delete a user</li>
        <li><code>GET /health</code> &mdash; health check</li>
      </ul>
    </main>
  </body>
</html>
